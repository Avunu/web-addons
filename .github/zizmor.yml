# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# Every `uses:` is hash-pinned with a version comment. Dependabot moves third-party pins;
# `odoo-init --sync` moves Avunu/odoo-nix's.
rules:
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  # Every Dependabot entry waits at least dependabot.cooldown-days.
  dependabot-cooldown:
    config:
      days: 7
