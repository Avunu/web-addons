# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# Dependency pull requests (odoo-nix docs: standards/ci.md):
# a Dependabot flake bump is relocked (`nix run .#relock`), then merged or left by the
# decision table.
name: deps
on:
  pull_request:
  # Bring the bot pull requests that are behind up to date.
  push:
    branches: ["develop"]
  workflow_dispatch:
permissions: {}
jobs:
  deps:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-deps.yml@372d6503e4f6a69d5a861c1b3e1b8c3807e9671b # v2.3.0
    with:
      shape: addons
      integration-branch: "develop"
      runs-on: '["self-hosted","nixos"]'
      auto-merge: true
      auto-merge-policy: all
      update-branches: true
      merge-method: squash
      client-id: ${{ vars.AVUNU_CI_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
