# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# Releases (odoo-nix docs: standards/versioning.md): after a merge to develop the CI App
# bumps each changed addon's version (`chore(release): bump …`) and fast-forwards
# 18.0 once that commit's checks are green.
name: release
on:
  push:
    branches: ["develop"]
  # Only ci's runs on the integration branch, and odoo-release.yml checks out that
  # branch, never a pull request's code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci]
    types: [completed]
    branches: ["develop"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-release.yml@b063f6e18b86619b545a01c24cf970484fb25878 # v2.3.2
    with:
      integration-branch: "develop"
      release-branch: "18.0"
      runs-on: '["self-hosted","nixos"]'
      client-id: ${{ vars.AVUNU_CI_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
