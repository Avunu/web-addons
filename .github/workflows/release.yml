# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# Releases (odoo-nix docs: standards/versioning.md): release-please keeps one release PR
# open on 18.0, raising each changed addon's version and changelog.
# Merging it tags each released addon `<addon>-18.0.x.y.z` and publishes its GitHub
# release, which carries the addon's zip and wheel. An addon with no release yet gets one
# for the version it has, at the head of 18.0.
name: release
on:
  push:
    branches: ["18.0"]
  workflow_dispatch:
    inputs:
      repackage:
        description: "A release tag to build and upload the zip and wheel for again"
        type: string
        default: ""
permissions: {}
concurrency:
  group: release-18.0
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-release-please.yml@917f576254afd3108f705a9097940fa51667f304 # v2.4.1
    with:
      series-branch: "18.0"
      runs-on: '["self-hosted","nixos"]'
      repackage: ${{ inputs.repackage || '' }}
      client-id: ${{ vars.AVUNU_CI_APP_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
