name: Mirror

# Keeps the series branch named in .odoo-series (`18.0`) a fast-forward copy of
# `develop`. Pull requests go to `develop`; consumers install and pin the series branch.
# This is a stopgap until Avunu's odoo-standards-profile renders the release flow, which
# will move the series branch only after the post-merge version bump and green checks.
#
# GitHub refuses a ref update from GITHUB_TOKEN onto commits that change
# .github/workflows/, so the org's GitHub App (variable AVUNU_CI_APP_ID, secret
# AVUNU_CI_PRIVATE_KEY) moves the branch when it is available to this repository. Without
# it, GITHUB_TOKEN moves the branch whenever no workflow file changed.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # move the series branch with GITHUB_TOKEN when the App is unavailable
    steps:
      - id: app
        name: Whether the org's GitHub App is available
        env:
          ENABLED: ${{ vars.AVUNU_CI_APP_ID != '' }}
        run: echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"

      # An App without Workflows write can't mint this token: fall back to GITHUB_TOKEN.
      - if: steps.app.outputs.enabled == 'true'
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AVUNU_CI_APP_ID }}
          private-key: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Fast-forward the series branch to develop, and read it back
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$REPO/git/ref/heads/develop" --jq .object.sha)"
          series="$(gh api "repos/$REPO/contents/.odoo-series?ref=$sha" \
            -H 'Accept: application/vnd.github.raw' | tr -d '[:space:]')"
          if ! [[ "$series" =~ ^[0-9]+\.0$ ]]; then
            echo "::error::.odoo-series on develop must name an Odoo series such as 18.0, not '$series'"
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/heads/$series" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$series" -f sha="$sha" -F force=false > /dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$series" -f sha="$sha" > /dev/null
          fi
          got="$(gh api "repos/$REPO/git/ref/heads/$series" --jq .object.sha)"
          if [ "$got" != "$sha" ]; then
            echo "::error::$series is at $got, not at develop's $sha"
            exit 1
          fi
          echo "$series is at develop's $sha"
