# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); do not edit.
# `ci / pr-policy` (odoo-nix docs: standards/ci.md): the pull request's base, title and
# commits. Its own file, so a retitle reruns only this check; on a push to the integration
# branch the reusable workflow skips it (green), as the release's bump commit needs.
name: pr-policy
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["develop"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pr-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-policy:
    name: ci
    permissions:
      contents: read
      pull-requests: read
    uses: Avunu/odoo-nix/.github/workflows/odoo-pr-policy.yml@b063f6e18b86619b545a01c24cf970484fb25878 # v2.3.2
    with:
      integration-branch: "develop"
      runs-on: '["self-hosted","nixos"]'
