# Backports: a merged pull request that carries a `backport <series>` label (for example
# `backport 18.0`) is cherry-picked onto that series branch as a new pull request, which
# the series' own gates then check like any other. A person decides which pull requests go
# back, by label; the label can be added before or after the merge. A cherry-pick that
# conflicts opens a draft pull request with the conflict committed and instructions on the
# original pull request, so it is resolved by hand, never guessed at.
#
# It runs on `pull_request`, not `pull_request_target`: the repository's secrets reach it
# only for pull requests from branches of this repository, which is who decides what goes
# back. A fork's merged pull request is backported by labelling it from a branch here.
name: backport
on:
  pull_request:
    types: [closed, labeled]
    branches: ["19.0"]
  # A pull request labelled after it merged runs the workflow as its own branch had it, so
  # an older pull request can be backported from here, with the current file.
  workflow_dispatch:
    inputs:
      pull_number:
        description: "The merged pull request on 19.0 to backport (it keeps its backport labels)"
        type: string
        required: true
permissions: {}
jobs:
  backport:
    name: backport
    # Merged, and carrying a backport label: the labelled event on a still-open pull
    # request has nothing to cherry-pick yet, and the closed event of an unmerged one never does.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.merged == true
      && contains(join(github.event.pull_request.labels.*.name, ','), 'backport '))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AVUNU_CI_APP_ID }}
          private-key: ${{ secrets.AVUNU_CI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      # The action pushes the backport branch with the credentials checkout leaves in
      # the repository, so they must persist; the token is the App's, scoped to this one
      # repository, and the job runs nothing but the pinned actions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: korthout/backport-action@ad272ff24e4a8593bf18a951a154ae6af93b26b8 # v5.0.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          # Never ends in `.0`: the series ruleset guards every branch matching `*.0`.
          branch_name: backport/${target_branch}/${pull_number}
          source_pr_number: ${{ inputs.pull_number }}
          label_pattern: '^backport (\d+\.0)$'
          # Keeps the conventional-commit title pr-policy and release-please read.
          pull_title: ${pull_title}
          copy_labels_pattern: '^(?!backport ).*'
          add_author_as_assignee: true
          experimental: '{"conflict_resolution": "draft_commit_conflicts"}'
