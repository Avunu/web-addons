[project]
name = "web-addons-tools"
version = "0"
requires-python = ">=3.12"
dependencies = ["prek==0.5.7", "ruff==0.13.0", "pylint-odoo==10.0.8", "oca-odoo-pre-commit-hooks==0.1.7", "pre-commit-hooks==6.0.0", "oca-maintainers-tools @ git+https://github.com/oca/maintainer-tools@b8311a95009805a6e5593f0390f52c0fa350117f", "manifestoo==1.2", "whool==1.3", "coverage==7.16.2", "checklog-odoo==1.0"]

[tool.uv]
package = false

[tool.coverage.run]
source = ["."]
branch = true
parallel = true
data_file = ".odoo-nix/coverage/.coverage"
omit = [".odoo-nix/*", "*/tests/*", "*/migrations/*", "*/upgrades/*", "*/__manifest__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
