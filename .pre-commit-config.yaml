# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); edit only inside the odoo-nix:local region.
# Every hook runs a locked tool: tools/.venv (tools/uv.lock), node_modules (package-lock.json) or
# tools/.bin (the engine's Nix tools). Shell entry runs `prek install -c .pre-commit-config.yaml`;
# CI runs `odoo-nix gate lint`.
exclude: |
  (?x)
  # NOT INSTALLABLE ADDONS
  # END NOT INSTALLABLE ADDONS
  # Files and folders generated by bots, to avoid loops
  ^setup/|/static/description/index\.html$|
  # We don't want to mess with tool-generated files
  .svg$|/tests/([^/]+/)?cassettes/|^.copier-answers.yml$|^eslint.config.cjs|^prettier.config.cjs|
  # Maybe reactivate this when all README files include prettier ignore tags?
  ^README\.md$|
  # Library files can have extraneous formatting (even minimized)
  /static/(src/)?lib/|
  # Repos using Sphinx to generate docs don't need prettying
  ^docs/_templates/.*\.html$|
  # Don't bother non-technical authors with formatting issues in docs
  readme/.*\.(rst|md)$|
  # Ignore build and dist directories in addons
  /build/|/dist/|
  # Ignore test files in addons
  /tests/samples/.*|
  # You don't usually want a bot to modify your legal texts
  (LICENSE.*|COPYING.*)|
  # odoo-nix:local-begin exclude
  # odoo-nix:local-end exclude
  # odoo-nix: locks
  (^|/)(uv|flake)\.lock$|(^|/)package-lock\.json$
repos:
  - repo: local
    hooks:
      - id: forbidden-files
        name: forbidden files
        entry: found forbidden files; remove them
        language: fail
        files: \.rej$
        exclude: ^\.github/
      - id: en-po-files
        name: en.po files cannot exist
        entry: found a en.po file
        language: fail
        files: "[a-zA-Z0-9_]*/i18n/en\\.po$"
        exclude: ^\.github/
      - id: obsolete dotfiles
        name: obsolete dotfiles
        entry: found obsolete files; remove them
        language: fail
        files: ^(\.travis\.yml|\.t2d\.yml|CONTRIBUTING\.md|\.prettierrc\.yml|\.eslintrc\.yml)$
        exclude: ^\.github/
      - id: whool-init
        name: init pyproject.toml with whool
        entry: tools/.venv/bin/whool init --exit-non-zero-on-changes
        language: system
        pass_filenames: false
        always_run: true
        exclude: ^\.github/
      - id: oca-fix-manifest-website
        name: Fix the manifest website key
        entry: tools/.venv/bin/oca-fix-manifest-website
        args: ["https://github.com/Avunu/web-addons"]
        language: system
        pass_filenames: false
        files: (__manifest__\.py|__openerp__\.py|__terp__\.py)$
        exclude: ^\.github/
      - id: oca-checks-odoo-module
        name: Checks for Odoo modules
        entry: tools/.venv/bin/oca-checks-odoo-module
        language: system
        require_serial: true
        files: \.(csv|xml)$|/\_\_(manifest|openerp)\_\_.py$
        exclude: ^\.github/
        types_or: ["csv", "python", "xml"]
      - id: oca-checks-po
        name: Checks for .po[t] files
        entry: tools/.venv/bin/oca-checks-po
        args: ["--disable=po-pretty-format"]
        language: system
        require_serial: false
        files: \.(po|pot)$
        exclude: ^\.github/
        types_or: ["text"]
      - id: prettier
        name: prettier (with plugin-xml)
        entry: node_modules/.bin/prettier
        args: ["--write", "--list-different", "--ignore-unknown"]
        language: system
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|ts|xml|yaml|yml)$
        exclude: ^\.github/|^\.vscode/|^(?:web_theme_carbon/tools/)
        types: ["text"]
      - id: eslint
        name: eslint
        entry: node_modules/.bin/eslint
        args: ["--color", "--fix"]
        language: system
        verbose: true
        exclude: ^\.github/|^(?:web_theme_carbon/tools/)
        types: ["javascript"]
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: tools/.venv/bin/trailing-whitespace-fixer
        language: system
        exclude: ^\.github/|/README\.rst$|\.pot?$
        types: ["text"]
        stages: ["pre-commit", "pre-push", "manual"]
      - id: end-of-file-fixer
        name: fix end of files
        entry: tools/.venv/bin/end-of-file-fixer
        language: system
        exclude: ^\.github/|/README\.rst$|\.pot?$
        types: ["text"]
        stages: ["pre-commit", "pre-push", "manual"]
      - id: debug-statements
        name: debug statements (python)
        entry: tools/.venv/bin/debug-statement-hook
        language: system
        exclude: ^\.github/
        types: ["python"]
      - id: fix-encoding-pragma
        name: fix python encoding pragma (deprecated)
        entry: tools/.venv/bin/fix-encoding-pragma
        args: ["--remove"]
        language: system
        exclude: ^\.github/
        types: ["python"]
      - id: check-case-conflict
        name: check for case conflicts
        entry: tools/.venv/bin/check-case-conflict
        language: system
        exclude: ^\.github/
      - id: check-docstring-first
        name: check docstring is first
        entry: tools/.venv/bin/check-docstring-first
        language: system
        exclude: ^\.github/
        types: ["python"]
      - id: check-executables-have-shebangs
        name: check that executables have shebangs
        entry: tools/.venv/bin/check-executables-have-shebangs
        language: system
        exclude: ^\.github/
        types: ["text", "executable"]
        stages: ["pre-commit", "pre-push", "manual"]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: tools/.venv/bin/check-merge-conflict
        language: system
        exclude: ^\.github/|/README\.rst$|^docs/.*\.rst$
        types: ["text"]
      - id: check-symlinks
        name: check for broken symlinks
        entry: tools/.venv/bin/check-symlinks
        language: system
        exclude: ^\.github/
        types: ["symlink"]
      - id: check-xml
        name: check xml
        entry: tools/.venv/bin/check-xml
        language: system
        exclude: ^\.github/
        types: ["xml"]
      - id: mixed-line-ending
        name: mixed line ending
        entry: tools/.venv/bin/mixed-line-ending
        args: ["--fix=lf"]
        language: system
        exclude: ^\.github/
        types: ["text"]
      - id: ruff
        name: ruff
        entry: tools/.venv/bin/ruff check --force-exclude
        args: ["--fix", "--exit-non-zero-on-fix"]
        language: system
        require_serial: true
        exclude: ^\.github/
        types_or: ["python", "pyi", "jupyter"]
      - id: ruff-format
        name: ruff-format
        entry: tools/.venv/bin/ruff format --force-exclude
        language: system
        require_serial: true
        exclude: ^\.github/
        types_or: ["python", "pyi", "jupyter"]
      - id: pylint_odoo
        name: pylint with optional checks
        entry: tools/.venv/bin/pylint
        args: ["--rcfile=.pylintrc", "--exit-zero"]
        language: system
        require_serial: true
        verbose: true
        exclude: ^\.github/
        types: ["python"]
      - id: pylint_odoo
        name: Check for Odoo modules using pylint
        entry: tools/.venv/bin/pylint
        args: ["--rcfile=.pylintrc-mandatory"]
        language: system
        require_serial: true
        exclude: ^\.github/
        types: ["python"]
      - id: check-json
        name: check-json
        entry: tools/.venv/bin/check-json
        language: system
        exclude: ^\.vscode/
        types: ["json"]
      - id: check-yaml
        name: check-yaml
        entry: tools/.venv/bin/check-yaml
        language: system
        types: ["yaml"]
      - id: actionlint
        name: actionlint
        entry: tools/.bin/actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: zizmor
        name: zizmor
        entry: tools/.bin/zizmor --offline --config .github/zizmor.yml
        language: system
        files: ^\.github/(workflows/.*\.ya?ml|dependabot\.ya?ml)$
      - id: nixfmt
        name: nixfmt
        entry: tools/.bin/nixfmt
        language: system
        types: ["nix"]
      - id: statix
        name: statix
        entry: tools/.bin/statix check
        language: system
        pass_filenames: false
        files: \.nix$
      - id: deadnix
        name: deadnix
        entry: tools/.bin/deadnix --fail
        language: system
        types: ["nix"]
      - id: committed
        name: committed
        entry: tools/.bin/committed --commit-file
        language: system
        stages: ["commit-msg"]
  # odoo-nix:local-begin hooks
  # odoo-nix:local-end hooks
