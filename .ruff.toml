# odoo-nix:managed — generated by odoo-nix (`odoo-init --sync`); edit only inside the odoo-nix:local region.
# OCA's ruff settings for Odoo 18.0 with python-lint's parameters
# ([tool.odoo-nix.python-lint] extra-select, ignore, per-file-ignores, extend-exclude).
target-version = "py310"
fix = true

[lint]
extend-select = ["B", "C90", "E501", "I", "UP"]
extend-safe-fixes = ["UP008"]
exclude = ["setup/*"]

[format]
exclude = ["setup/*"]

[lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"__manifest__.py" = ["B018"]

[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
odoo = ["odoo"]
odoo-addons = ["odoo.addons"]

[lint.mccabe]
max-complexity = 16

# A local region after [lint.mccabe] opens with a table header of its own.
# odoo-nix:local-begin ruff
# odoo-nix:local-end ruff
