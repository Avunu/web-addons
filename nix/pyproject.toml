[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

# Legacy sdist-only dependencies that do not declare setuptools as a build
# dependency. Maintained from uv.lock (odoo-nix-build-deps).
[tool.uv.extra-build-dependencies]
# >>> odoo-nix: sdist build deps (managed) >>>
"docopt" = ["setuptools"]
"odoo" = ["setuptools"]
"ofxparse" = ["setuptools"]
"python-ldap" = ["setuptools"]
"rjsmin" = ["setuptools"]
"vobject" = ["setuptools"]
# <<< odoo-nix: sdist build deps (managed) <<<

[tool.odoo-nix]
schema = 1
profile = "github:Avunu/odoo-standards-profile/v1"

[tool.odoo-nix.icons]
src-icon = "assets/icons/web-addons.png"

[tool.odoo-nix.js-xml]
exclude = ["web_theme_carbon/tools/"]
